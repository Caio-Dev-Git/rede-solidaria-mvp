name: CI

on:
  push:
    branches:
      - main
      - feat/revisao-tecnica-mvp
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run automated tests with coverage
        run: node --test --experimental-test-coverage "tests/**/*.test.js"
